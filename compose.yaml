services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: industrial-defect-ai:cpu
    command:
      - python
      - -m
      - uvicorn
      - app.api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./models:/app/models:ro
      - ./data/database:/app/data/database
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: industrial-defect-ai:cpu
    command:
      - python
      - -m
      - streamlit
      - run
      - app/dashboard.py
      - --server.address
      - 0.0.0.0
      - --server.port
      - "8501"
      - --server.maxUploadSize
      - "10"
      - --server.headless
      - "true"
    environment:
      API_URL: http://api:8000
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
